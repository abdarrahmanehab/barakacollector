<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Blocks in elhy_eltasee</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #fff8dc 30%, #ffd700 70%, #ffffff 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            padding: 0 20px;
        }

        .header {
            text-align: center;
            margin: 40px auto 50px auto;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 215, 0, 0.1), rgba(255, 248, 220, 0.2), rgba(255, 215, 0, 0.1));
            z-index: -1;
        }

        .header h1 {
            font-size: 48px;
            background: linear-gradient(45deg, #8B4513, #A0522D, #CD853F, #A0522D, #8B4513);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldShine 3s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(139, 69, 19, 0.3);
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        @keyframes goldShine {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .map-link {
            display: inline-block;
            background: linear-gradient(45deg, #b8860b, #ffd700);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
            border: none;
            position: relative;
            z-index: 1;
        }

        .map-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
            background: linear-gradient(45deg, #ffd700, #ffed4e);
        }

        .white-screen {
            position: fixed;
            top: 220px;
            right: 40px;
            width: 450px;
            height: 550px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 3px solid rgba(255, 215, 0, 0.4);
            z-index: 1000;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .map-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            display: none;
        }

        .map-image.show {
            display: block;
        }

        .placeholder-text {
            color: #ccc;
            font-size: 18px;
            text-align: center;
        }

        .placeholder-text.hide {
            display: none;
        }

        .units-table {
            position: absolute;
            top: 250px;
            left: 40px;
            width: 300px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .units-table h3 {
            text-align: center;
            color: #8B4513;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .unit-button {
            display: block;
            width: 100%;
            background: linear-gradient(45deg, #b8860b, #ffd700);
            color: white;
            padding: 12px 20px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .unit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
            background: linear-gradient(45deg, #ffd700, #ffed4e);
        }

        .unit-button:last-child {
            margin-bottom: 0;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .white-screen {
                position: relative;
                top: auto;
                right: auto;
                width: 100%;
                height: 400px;
                margin: 30px 0;
            }

            .units-table {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                margin: 20px 0;
            }

            .container {
                padding: 0 15px;
            }

            .header {
                margin: 20px auto 30px auto;
                padding: 25px 30px;
            }

            .header h1 {
                font-size: 36px;
            }

            .map-link {
                padding: 12px 25px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .header {
                margin: 15px auto 25px auto;
                padding: 20px 25px;
            }

            .header h1 {
                font-size: 28px;
            }

            .white-screen {
                height: 300px;
                padding: 15px;
                margin: 20px 0;
            }

            .map-link {
                padding: 10px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Available Blocks in elhy_eltasee</h1>
            <button class="map-link" onclick="showGeneralMap()">📍 General Map</button>
        </div>
    </div>

    <div class="units-table">
        <h3>Available Blocks</h3>
        <button class="unit-button" onclick="showUnitMap('a40', 'a40/a40 map location.png')">🏠 A40 Block</button>
        <button class="unit-button" onclick="showUnitMap('c37', 'c37/c37 map location.jpeg')">🏠 C37 Block</button>
        <button class="unit-button" onclick="showUnitMap('c60', 'c60/c60 map location.jpg')">🏠 C60 Block</button>
        <button class="unit-button" onclick="showUnitMap('d8', 'd8/d8 map location.jpg')">🏠 D8 Block</button>
    </div>

    <div class="white-screen">
        <div class="placeholder-text" id="placeholderText">Click "General Map" or any block to view the map</div>
        <img src="" alt="Map" class="map-image" id="mapImage">
    </div>

    <script>
        function showGeneralMap() {
            const mapImage = document.getElementById('mapImage');
            const placeholderText = document.getElementById('placeholderText');
            const mapLink = document.querySelector('.map-link');

            if (mapImage.classList.contains('show') && mapImage.src.includes('general_map_7ytasee.jpeg')) {
                // Hide map
                mapImage.classList.remove('show');
                placeholderText.classList.remove('hide');
                mapLink.textContent = '📍 General Map';
            } else {
                // Show general map
                mapImage.src = 'general_map_7ytasee.jpeg';
                mapImage.alt = 'General Map';
                mapImage.classList.add('show');
                placeholderText.classList.add('hide');
                mapLink.textContent = '❌ Hide Map';
            }
        }

        function showUnitMap(unitName, mapPath) {
            const mapImage = document.getElementById('mapImage');
            const placeholderText = document.getElementById('placeholderText');
            const mapLink = document.querySelector('.map-link');

            // Show unit map
            mapImage.src = mapPath;
            mapImage.alt = unitName.toUpperCase() + ' Block Map';
            mapImage.classList.add('show');
            placeholderText.classList.add('hide');

            // Reset general map button
            mapLink.textContent = '📍 General Map';
        }
    </script>

</body>

</html>
